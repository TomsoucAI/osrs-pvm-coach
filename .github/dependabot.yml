version: 2
updates:
  # CI actions are pinned to commit SHAs; Dependabot keeps the SHA and the version comment current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # A Dependabot PR here changes package-lock.json only. Before merge, rebuild and commit
  # app/dist/ (npm test in app/), because users run the committed bundle.
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gradle"
    directory: "/plugin"
    schedule:
      interval: "monthly"
    # Stay on the Gradle major that RuneLite's example-plugin template uses (8.x).
    # Gradle 9 fails the test task: the template's DpsBridgePluginTest is a launcher, not a test.
    # Move to 9 when runelite/example-plugin does.
    ignore:
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/evals"
    schedule:
      interval: "monthly"
    # CI does not run evals/, so a green PR here proves nothing. mcp 2.x removed
    # streamablehttp_client, which evals/connections.py imports. Stay on 1.x until the
    # evals are migrated to the v2 API.
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
