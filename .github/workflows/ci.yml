name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  legal-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Exits 1 on a RED finding, which fails the job.
      - run: node tools/legal-lint.mjs

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      # Clones the Wiki DPS engine at the commit pinned in app/setup.mjs.
      - run: npm run setup
      # Builds the app, then runs the selftest and the smoke test.
      - run: npm test

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew build
